plugins {
    id 'com.android.application'
}

android {
    namespace 'com.moodtree.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.moodtree.app"
        minSdk 26          // Android 8.0，覆盖 99% 在用设备
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        vectorDrawables { useSupportLibrary true }
    }

    // 读取签名配置（keystore.properties 不进版本控制，含密钥密码）
    def keystoreProps = new Properties()
    def keystoreFile = rootProject.file('keystore.properties')
    if (keystoreFile.exists()) {
        keystoreProps.load(new FileInputStream(keystoreFile))
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.7'

    // Room 本地数据库
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // JSON
    implementation 'com.google.code.gson:gson:2.11.0'
}
